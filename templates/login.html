<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — AC Maintenance Dashboard</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:         rgba(11,11,11,0.10);
    --status-critical: #d03b3b;
    --series-temp: #2a78d6;
    --shadow: rgba(11,11,11,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:         rgba(255,255,255,0.10);
      --status-critical: #d03b3b;
      --series-temp: #3987e5;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);
    --status-critical: #d03b3b;
    --series-temp: #3987e5;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .login-card {
    width: 100%;
    max-width: 320px;
    padding: 28px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    box-shadow: 0 8px 32px var(--shadow);
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 20px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    background: var(--page);
    color: var(--text-primary);
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--series-temp); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 20px;
    background: var(--series-temp);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .error {
    margin-top: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--status-critical);
    color: var(--status-critical);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="viz-root">
  <div class="page">
    <div class="login-card">
      <h1>AC Maintenance Dashboard</h1>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
