<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC Maintenance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
    --series-temp: #2a78d6; /* categorical slot 1 - blue */
    --series-vib:  #eb6834; /* categorical slot 2 - orange */
    --series-hum:  #1baf7a; /* categorical slot 3 - aqua */
    --shadow: rgba(11,11,11,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-critical: #d03b3b;
      --series-temp: #3987e5;
      --series-vib:  #d95926;
      --series-hum:  #199e70;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
    --series-temp: #3987e5;
    --series-vib:  #d95926;
    --series-hum:  #199e70;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
  }
  .updated {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: -12px 0 20px;
  }

  /* --- Status card --- */
  .status-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    margin-bottom: 24px;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    white-space: nowrap;
    color: #fff;
  }
  .status-badge .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: currentColor;
    filter: brightness(1.6);
  }
  .status-badge[data-status="NORMAL"]   { background: var(--status-good); }
  .status-badge[data-status="WARNING"]  { background: var(--status-warning); color: #1a1200; }
  .status-badge[data-status="CRITICAL"] { background: var(--status-critical); }
  .status-badge[data-status="—"]        { background: var(--text-muted); }

  .readings {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .reading {
    display: flex;
    flex-direction: column;
  }
  .reading .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .reading .value {
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* --- Charts --- */
  .charts {
    display: grid;
    gap: 16px;
  }
  .chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .chart-card h2 {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--text-secondary);
  }
  .chart-card canvas { max-height: 220px; }

  /* --- Table view (accessibility fallback for the charts) --- */
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 16px 0;
  }
  .table-toggle {
    display: inline-block;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.8rem;
    text-decoration: none;
    cursor: pointer;
  }
  table.data-table {
    display: none;
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table.data-table.visible { display: table; }
  table.data-table th, table.data-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
  }

  /* --- Chat widget --- */
  .chat-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--series-temp);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px var(--shadow);
    z-index: 40;
  }
  .chat-toggle svg { width: 24px; height: 24px; }

  .chat-panel {
    position: fixed;
    right: 20px;
    bottom: 84px;
    width: min(340px, calc(100vw - 40px));
    max-height: min(480px, calc(100vh - 120px));
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px var(--shadow);
    overflow: hidden;
    z-index: 40;
  }
  .chat-panel[hidden] { display: none; }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 0.9rem;
  }
  .chat-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 0.85rem;
  }
  .chat-msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .chat-msg-bot {
    align-self: flex-start;
    background: var(--page);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }
  .chat-msg-user {
    align-self: flex-end;
    background: var(--series-temp);
    color: #fff;
  }
  .chat-msg-error {
    align-self: flex-start;
    background: var(--page);
    border: 1px solid var(--status-critical);
    color: var(--status-critical);
  }
  .chat-msg-pending { color: var(--text-muted); font-style: italic; }

  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .chat-input-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: inherit;
  }
  .chat-input-row input:focus { outline: 2px solid var(--series-temp); outline-offset: 1px; }
  .chat-send {
    background: var(--series-temp);
    border: none;
    color: #fff;
    width: 36px;
    flex: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-send:disabled { opacity: 0.5; cursor: default; }
  .stale-warning {
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #fff4e6;
    color: #633d00;
    border: 1px solid rgba(250,178,25,0.15);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="viz-root">
  <div class="page">
    <div class="page-header">
      <h1>AC Maintenance Dashboard</h1>
      <a class="table-toggle" href="/logout">Log out</a>
    </div>
    <div class="updated" id="last-updated">Loading…</div>
    <div class="stale-warning" id="stale-warning" hidden></div>

    <div class="status-card">
      <span class="status-badge" data-status="—" id="status-badge">
        <span class="dot"></span>
        <span id="status-text">—</span>
      </span>
      <div class="readings">
        <div class="reading">
          <span class="label">Temperature</span>
          <span class="value" id="val-temp">—</span>
        </div>
        <div class="reading">
          <span class="label">Humidity</span>
          <span class="value" id="val-hum">—</span>
        </div>
        <div class="reading">
          <span class="label">Vibration</span>
          <span class="value" id="val-vib">—</span>
        </div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h2>Temperature — past 7 days (°C)</h2>
        <canvas id="chart-temp"></canvas>
      </div>
      <div class="chart-card">
        <h2>Humidity — past 7 days (%)</h2>
        <canvas id="chart-hum"></canvas>
      </div>
      <div class="chart-card">
        <h2>Vibration — past 7 days</h2>
        <canvas id="chart-vib"></canvas>
      </div>
    </div>

    <div class="actions">
      <button class="table-toggle" id="table-toggle">View as table</button>
      <a class="table-toggle" href="/api/download-csv" download>Download CSV</a>
    </div>
    <table class="data-table" id="data-table">
      <thead>
        <tr><th>Timestamp</th><th>Temperature</th><th>Humidity</th><th>Vibration</th><th>Status</th></tr>
      </thead>
      <tbody id="data-table-body"></tbody>
    </table>
  </div>

  <button class="chat-toggle" id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-panel" title="Ask the AC assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </button>

  <div class="chat-panel" id="chat-panel" hidden>
    <div class="chat-header">
      <span>AC Assistant</span>
      <button class="chat-close" id="chat-close" type="button" aria-label="Close chat">&times;</button>
    </div>
    <div class="chat-messages" id="chat-messages" aria-live="polite">
      <div class="chat-msg chat-msg-bot">Ask me about the AC's current status or recent history.</div>
    </div>
    <form class="chat-input-row" id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask a question…" autocomplete="off" aria-label="Message to the AC assistant">
      <button type="submit" class="chat-send" aria-label="Send">&#10148;</button>
    </form>
  </div>
</div>

<script>
const REFRESH_MS = 30000; // keep in step with the server's poll interval

function cssVar(name) {
  return getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(name).trim();
}

function baseLineOptions(seriesColor) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false }, // single series — the card title names it
      tooltip: {
        backgroundColor: cssVar('--surface-1'),
        titleColor: cssVar('--text-primary'),
        bodyColor: cssVar('--text-secondary'),
        borderColor: cssVar('--border'),
        borderWidth: 1,
      },
    },
    scales: {
      x: {
        grid: { color: cssVar('--gridline') },
        ticks: { color: cssVar('--text-muted'), maxTicksLimit: 6 },
        border: { color: cssVar('--axis') },
      },
      y: {
        grid: { color: cssVar('--gridline') },
        ticks: { color: cssVar('--text-muted') },
        border: { color: cssVar('--axis') },
      },
    },
    elements: {
      line: { borderWidth: 2, borderColor: seriesColor, tension: 0.2 },
      point: { radius: 0, hoverRadius: 4, backgroundColor: seriesColor },
    },
  };
}

function makeChart(canvasId, seriesColor) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ data: [], borderColor: seriesColor, backgroundColor: seriesColor }] },
    options: baseLineOptions(seriesColor),
  });
}

const tempChart = makeChart('chart-temp', cssVar('--series-temp'));
const humChart  = makeChart('chart-hum',  cssVar('--series-hum'));
const vibChart  = makeChart('chart-vib',  cssVar('--series-vib'));

function formatTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function refreshCurrent() {
  try {
    const res = await fetch('/api/current');
    const data = await res.json();
    const badge = document.getElementById('status-badge');
    const staleEl = document.getElementById('stale-warning');

    // Empty object means there are no real readings at all in the DB
    if (!data || Object.keys(data).length === 0) {
      badge.dataset.status = '—';
      document.getElementById('status-text').textContent = '—';
      document.getElementById('val-temp').textContent = '—';
      document.getElementById('val-hum').textContent = '—';
      document.getElementById('val-vib').textContent = '—';
      document.getElementById('last-updated').textContent = 'No real readings logged yet.';
      staleEl.textContent = 'No live data — no real readings have been uploaded to the server yet.';
      staleEl.hidden = false;
      return;
    }

    const status = data.status || '—';
    badge.dataset.status = status;
    document.getElementById('status-text').textContent = status;
    document.getElementById('val-temp').textContent = data.temperature != null ? `${data.temperature}°C` : '—';
    document.getElementById('val-hum').textContent = data.humidity != null ? `${data.humidity}%` : '—';
    document.getElementById('val-vib').textContent = data.vibration != null ? data.vibration : '—';
    document.getElementById('last-updated').textContent = data.timestamp
      ? `Last reading: ${formatTime(data.timestamp)}`
      : 'No real readings logged yet.';

    // Show a clear stale-data banner when recent uploads have stopped
    if (data.is_stale) {
      staleEl.textContent = `No live data — nothing uploaded recently (last at ${formatTime(data.timestamp)}).`;
      staleEl.hidden = false;
    } else {
      staleEl.hidden = true;
    }
  } catch (e) {
    document.getElementById('last-updated').textContent = 'Unable to reach server';
  }
}

async function refreshHistory() {
  try {
    const res = await fetch('/api/history');
    const rows = await res.json();
    const labels = rows.map(r => formatTime(r.timestamp));

    tempChart.data.labels = labels;
    tempChart.data.datasets[0].data = rows.map(r => r.temperature);
    tempChart.update();

    humChart.data.labels = labels;
    humChart.data.datasets[0].data = rows.map(r => r.humidity);
    humChart.update();

    vibChart.data.labels = labels;
    vibChart.data.datasets[0].data = rows.map(r => r.vibration);
    vibChart.update();

    const tbody = document.getElementById('data-table-body');
    tbody.innerHTML = rows.slice().reverse().map(r => `
      <tr>
        <td>${formatTime(r.timestamp)}</td>
        <td>${r.temperature}</td>
        <td>${r.humidity}</td>
        <td>${r.vibration}</td>
        <td>${r.status}</td>
      </tr>
    `).join('');
  } catch (e) {
    // Charts just keep showing the last successful data; no need to blank them.
  }
}

document.getElementById('table-toggle').addEventListener('click', () => {
  document.getElementById('data-table').classList.toggle('visible');
});

function refreshAll() {
  refreshCurrent();
  refreshHistory();
}

refreshAll();
setInterval(refreshAll, REFRESH_MS);

// --- Chat widget ---
const chatToggle = document.getElementById('chat-toggle');
const chatPanel = document.getElementById('chat-panel');
const chatClose = document.getElementById('chat-close');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatMessages = document.getElementById('chat-messages');

function openChat() {
  chatPanel.hidden = false;
  chatToggle.setAttribute('aria-expanded', 'true');
  chatInput.focus();
}
function closeChat() {
  chatPanel.hidden = true;
  chatToggle.setAttribute('aria-expanded', 'false');
}
chatToggle.addEventListener('click', () => {
  if (chatPanel.hidden) openChat(); else closeChat();
});
chatClose.addEventListener('click', closeChat);

function addChatMessage(text, cls) {
  const div = document.createElement('div');
  div.className = `chat-msg ${cls}`;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;

  addChatMessage(message, 'chat-msg-user');
  chatInput.value = '';
  chatInput.disabled = true;
  const pending = addChatMessage('Thinking…', 'chat-msg-bot chat-msg-pending');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok) {
      addChatMessage(data.error || 'Something went wrong.', 'chat-msg-error');
    } else {
      addChatMessage(data.reply, 'chat-msg-bot');
    }
  } catch (err) {
    pending.remove();
    addChatMessage('Could not reach the server.', 'chat-msg-error');
  } finally {
    chatInput.disabled = false;
    chatInput.focus();
  }
});
</script>
</body>
</html>
